[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradewise-backend"
version = "1.1.0"
description = "GradeWise physics calculation engine + FastAPI recommendation API for stainless steel grades"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
gradewise-calc = "engine.cli:main"

[tool.setuptools]
packages = ["engine"]

[tool.setuptools.package-data]
engine = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["E501"]